# Keeps a release pull request open with the next version and its changelog, worked out by
# release-please from the Conventional Commits pushed to main. Merging that pull request tags the
# version and publishes a GitHub release with its changelog; the builds for each system are then
# attached to it, with a file of their SHA-256 checksums, and the changes contributors made are
# credited to them in its notes. Each archive, and each executable in it, gets a build provenance
# attestation, which `gh attestation verify` checks.
#
# The macOS builds carry SANE, so scanning works with nothing to install
# (`scripts/build-sane-macos.sh`). Its licence asks for the source to come with it, so the source
# archives it's built from are attached to the release too.
#
# Run by hand from the Actions tab, it builds everything and keeps the archives as the run's
# artifacts, but publishes nothing and makes no attestations.
#
# The builds are attached after release-please has published the release, so the repository's
# immutable releases must stay off: GitHub refuses files for an immutable release once it is
# published.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-windows-gnu }
          - { name: windows-aarch64, os: windows-latest, target: aarch64-windows-gnu }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-macos, sane: x86_64 }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-macos, sane: arm64 }
    runs-on: ${{ matrix.os }}
    # The build only reads the repository. The attestations need a token from GitHub's OIDC provider,
    # to get a signing certificate from Sigstore, and the rights `actions/attest` asks for to store
    # them.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # The whole history with its tags, so that the build can name the commit a build by hand is
      # past the last release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # An explicit target builds for the architecture's baseline processor, so the binary runs on
      # any machine of that kind, not just ones like the runner.
      - run: zig build --release=fast -Dstrip -Dtarget=${{ matrix.target }}
      # SANE for the Mac, built from its pinned source, with the source archives kept for the release.
      - if: matrix.sane
        run: scripts/build-sane-macos.sh ${{ matrix.sane }} sane sane-source
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.tag || github.ref_name }}
        run: |
          name="minilab-$VERSION-${{ matrix.name }}"
          mkdir -p "$name" dist
          for file in README.md LICENSE CHANGELOG.md; do
            if [ -f "$file" ]; then cp "$file" "$name"/; fi
          done
          # The licences and notices of the libraries and fonts whose text has to go with every copy:
          # everything the build installs beside the program.
          find zig-out -maxdepth 1 -type f -exec cp {} "$name"/ \;
          # SANE goes next to the program, where minilab looks for it. Both Mac builds have the same
          # source archives, so one of them puts them out for the release.
          if [ -n "${{ matrix.sane }}" ]; then
            cp -R sane "$name"/
          fi
          if [ "${{ matrix.name }}" = macos-aarch64 ]; then
            cp sane-source/* dist/
          fi
          case "${{ matrix.target }}" in
            *windows*)
              cp zig-out/bin/minilab.exe "$name"/
              7z a -tzip "dist/$name.zip" "$name" > /dev/null
              ;;
            *)
              cp zig-out/bin/minilab "$name"/
              tar -czf "dist/$name.tar.gz" "$name"
              ;;
          esac
      # For a release, the archive and the executable in it get a build provenance attestation,
      # signed through Sigstore, which names the workflow run that built them and its commit.
      - if: needs.release-please.outputs.created == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*
            zig-out/bin/*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  attach:
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      # For the script that credits the contributors.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The SHA-256 of each archive, SANE's source among them, in the format `sha256sum --check` reads.
      - name: Write the checksums of the archives
        working-directory: dist
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: sha256sum -- *.tar.gz *.tar.bz2 *.zip > "minilab-$TAG-sha256sums.txt"
      # Each change a contributor made gets their handle in the notes (`release-credits.sh`).
      - name: Attach the builds to the release, and credit the contributors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          changelog="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | scripts/release-credits.sh)"
          note="The macOS builds come with scanner drivers (SANE). On Linux you need SANE, and on Windows your scanner maker's TWAIN driver (see the README). The macOS builds aren't signed, so macOS blocks them the first time you open one: run \`xattr -dr com.apple.quarantine .\` once in the folder you unpacked to let it through. The source of the SANE they carry is attached here too. To check a download, compare it with \`minilab-$TAG-sha256sums.txt\`, or run \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$note

          $changelog"
