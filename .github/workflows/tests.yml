# Builds minilab and runs the tests on Linux, macOS and Windows for every pull request and every
# push to main, checks the Zig code's formatting and the repository's files, and builds every
# target a release builds, the way a release builds it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      # The formatting and the files are the same on every system, so they're checked once, the
      # way `make check` does.
      - if: runner.os == 'Linux'
        run: make fmt-check check-files
      - run: zig build --summary all
      - run: zig build test --summary all
      # Releases are built ReleaseFast, without the safety checks, so the tests run in that mode too.
      - run: zig build test --release=fast --summary all

  # Builds minilab for every target a release builds, on the same runners and with the same command
  # as release.yml: linked, with -Dupdates, and the app on the Macs. The tests above only run on
  # each system's own CPU and without the updater, so a mistake that only shows up on another
  # target, at link time or in the updater would otherwise be found at release time, after the
  # release is already public. Windows on Arm, for one, needs function pointers 4-byte aligned.
  release-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-linux-gnu }
          - { os: windows-latest, target: x86_64-windows-gnu }
          - { os: windows-latest, target: aarch64-windows-gnu }
          - { os: macos-latest, target: x86_64-macos, app: app }
          - { os: macos-latest, target: aarch64-macos, app: app }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - run: zig build install ${{ matrix.app }} --release=fast -Dstrip -Dupdates -Dtarget=${{ matrix.target }}
