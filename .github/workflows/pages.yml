name: Pages

# Publishes the website in site/ to GitHub Pages. The repository holds no pictures, so the
# screenshots come from the assets of the site-images release instead.

on:
  push:
    branches: [main]
    paths: [site/**, docs/icon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add the icon and the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp docs/icon.svg site/
          gh release download site-images --repo "$GITHUB_REPOSITORY" --dir site/images --pattern '*.webp'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5