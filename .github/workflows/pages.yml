name: Pages

# Publishes the website in site/ to GitHub Pages. The repository holds no pictures, so the
# screenshots come from the assets of the site-images release instead.

on:
  push:
    branches: [main]
    paths: [site/**, docs/icon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Add the icon and the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp docs/icon.svg site/
          gh release download site-images --repo "$GITHUB_REPOSITORY" --dir site/images --pattern '*.webp'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
